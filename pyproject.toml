[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "ollama>=0.6.0",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
    chroma_db
  | \.trees
  | \.venv
)/
'''
